name: Update ChatGPT Voice IPv4 list

on:
  schedule:
    - cron: "25 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_chatgpt_voice.py
      - .github/workflows/update-chatgpt-voice.yml

permissions:
  contents: write

concurrency:
  group: update-chatgpt-voice
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Update list
        run: python scripts/update_chatgpt_voice.py
      - name: Commit changed list
        run: |
          git add -- ChatGPTVoiceIPv4.txt
          if git diff --cached --quiet -- ChatGPTVoiceIPv4.txt; then
            echo "ChatGPT Voice IPv4 list is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ChatGPT Voice IPv4 list" -- ChatGPTVoiceIPv4.txt
          git push
